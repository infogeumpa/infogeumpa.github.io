<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Menghubungkan TikTok — Info Geumpa</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f6fb;color:#172033;font:16px system-ui, sans-serif}
    main{width:min(100%,520px);background:#fff;padding:32px;border-radius:20px;box-shadow:0 12px 40px #14213d12;text-align:center}
    h1{font-size:22px;margin:0 0 12px}p{line-height:1.6;color:#526078}.spinner{width:34px;height:34px;border:4px solid #e4eaf3;border-top-color:#2563eb;border-radius:50%;margin:22px auto;animation:spin .8s linear infinite}
    a{color:#2563eb}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main>
    <h1 id="title">Memproses koneksi TikTok</h1>
    <div class="spinner" id="spinner"></div>
    <p id="message">Mohon tunggu, Anda akan diarahkan ke proses verifikasi yang aman.</p>
    <p><a id="retry" href="../">Kembali ke Info Geumpa</a></p>
  </main>
  <script>
    // URL Apps Script Web App /exec dimasukkan di sini setelah deployment.
    const APPS_SCRIPT_WEB_APP_URL = 'GANTI_DENGAN_URL_WEB_APP_APPS_SCRIPT';
    const params = new URLSearchParams(location.search);
    const code = params.get('code');
    const state = params.get('state');
    const error = params.get('error');
    const description = params.get('error_description');

    if (error) {
      document.getElementById('title').textContent = 'Izin TikTok tidak diberikan';
      document.getElementById('spinner').hidden = true;
      document.getElementById('message').textContent = description || error;
    } else if (!code || !state) {
      document.getElementById('title').textContent = 'Parameter callback tidak lengkap';
      document.getElementById('spinner').hidden = true;
      document.getElementById('message').textContent = 'Kode otorisasi atau state tidak ditemukan. Silakan mulai koneksi dari Info Geumpa.';
    } else if (APPS_SCRIPT_WEB_APP_URL.startsWith('https://script.google.com/')) {
      const target = new URL(APPS_SCRIPT_WEB_APP_URL);
      target.searchParams.set('code', code);
      target.searchParams.set('state', state);
      location.replace(target.toString());
    } else {
      document.getElementById('title').textContent = 'Callback belum dikonfigurasi';
      document.getElementById('spinner').hidden = true;
      document.getElementById('message').textContent = 'Isi URL Web App Google Apps Script pada file callback.html sebelum digunakan.';
    }
  </script>
</body>
</html>
