
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikTok Video Uploader</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101114;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      width: 90%;
      max-width: 430px;
      background: #202127;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      box-sizing: border-box;
    }

    h2 { margin-bottom: 15px; }

    p {
      color: #bbb;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .status {
      color: #35d07f;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">

    <h2>TikTok Video Uploader</h2>

    <p class="status" id="status">
      Memeriksa autentikasi...
    </p>

    <p id="detail">
      Mohon tunggu sebentar.
    </p>

  </div>

  <script>

    // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT
    const GAS_URL =
      "ISI_URL_WEB_APP_GOOGLE_SCRIPT";

    const params = new URLSearchParams(
      window.location.search
    );

    const code = params.get("code");
    const state = params.get("state");
    const error = params.get("error");

    const status = document.getElementById("status");
    const detail = document.getElementById("detail");

    if (error) {

      status.textContent = "LOGIN GAGAL";

      detail.textContent =
        "TikTok mengembalikan error: " + error;

    } else if (code && state) {

      status.textContent = "LOGIN BERHASIL";

      detail.textContent =
        "Meneruskan proses OAuth ke Google Apps Script...";

      const target =
        GAS_URL +
        "?code=" + encodeURIComponent(code) +
        "&state=" + encodeURIComponent(state);

      window.location.replace(target);

    } else {

      status.textContent = "TIKTOK UPLOADER SIAP";

      detail.textContent =
        "Halaman callback aktif. Silakan mulai login dari Google Apps Script.";

    }

  </script>

</body>
</html>
