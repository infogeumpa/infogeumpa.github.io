
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikTok Video Uploader</title>
  <meta name="theme-color" content="#101010">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 32px;
      border: 1px solid #333;
      border-radius: 20px;
      background: #191919;
      text-align: center;
    }

    h1 { font-size: 25px; }

    p {
      color: #aaa;
      line-height: 1.6;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: 0;
      border-radius: 10px;
      background: #fe2c55;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin-top: 18px;
      font-size: 13px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>TikTok Video Uploader</h1>
    <p>
      Hubungkan akun TikTok untuk mengirim video
      langsung ke TikTok Inbox.
    </p>

    <button id="loginButton">
      Login dengan TikTok
    </button>

    <div id="status">Ready</div>
  </main>

  <script>
    // GANTI dengan URL Web App Google Apps Script Anda.
    const GAS_URL =
      "https://script.google.com/macros/s/ISI_DEPLOYMENT_ID/exec";

    const params = new URLSearchParams(location.search);

    const code = params.get("code");
    const state = params.get("state");
    const error = params.get("error");

    const status = document.getElementById("status");

    if (error) {
      status.textContent =
        "TikTok OAuth Error: " +
        (params.get("error_description") || error);
    } else if (code) {
      status.textContent = "Mengirim authorization code...";

      const callback =
        GAS_URL +
        "?code=" + encodeURIComponent(code) +
        "&state=" + encodeURIComponent(state || "");

      location.replace(callback);
    }

    document.getElementById("loginButton")
      .addEventListener("click", function() {
        status.textContent = "Membuka TikTok OAuth...";
        location.href = GAS_URL + "?action=login";
      });
  </script>
</body>
</html>
