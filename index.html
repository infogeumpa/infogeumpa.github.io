
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikTok Authorization Callback</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101114;
      color: white;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }
    main { text-align: center; padding: 25px; }
    p { color: #aaa; }
  </style>
</head>
<body>
<main>
  <h2 id="status">Menghubungkan TikTok...</h2>
  <p id="message">Mohon tunggu, sedang memproses autentikasi.</p>
</main>

<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  const state = params.get("state");
  const error = params.get("error");

  const status = document.getElementById("status");
  const message = document.getElementById("message");

  if (error) {
    status.textContent = "Login gagal";
    message.textContent = error;
    return;
  }

  if (!code || !state) {
    status.textContent = "Parameter tidak lengkap";
    message.textContent = "Authorization code atau state tidak ditemukan.";
    return;
  }

  status.textContent = "Memproses authorization...";
  message.textContent = "Menghubungkan ke Google Apps Script.";

  const endpoint =
    "https://script.google.com/macros/s/AKfycbzOi_ROmPuNR62mgGWWZvl8Oo43jlyBksSeK9YPEa7IRMP27jOhYsnpGJiEVbGrREWv/exec";

  const target = new URL(endpoint);
  target.searchParams.set("action", "callback");
  target.searchParams.set("code", code);
  target.searchParams.set("state", state);

  location.replace(target.toString());
})();
</script>
</body>
</html>
